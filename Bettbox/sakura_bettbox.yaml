# --- 策略组 (Proxy Groups) ---

# 策略组通用配置
group_common:
  group_common_select:
    &group_common_select {
      type: select,
      interval: 60,
      timeout: 1000,
      # max-failed-times: 3,
      empty-fallback: REJECT,
      url: 'https://g.cn/generate_204',
      lazy: true,
    }

  group_common_auto:
    &group_common_auto {
      type: url-test,
      interval: 60,
      timeout: 1000,
      # max-failed-times: 3,
      empty-fallback: REJECT,
      url: 'https://g.cn/generate_204',
      lazy: true,
      tolerance: 10,
      # include-all: true,
      exclude-type: 'DIRECT',
      icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png',
      hidden: true,
    }

  group_common_load:
    &group_common_load {
      type: load-balance,
      interval: 60,
      timeout: 1000,
      # max-failed-times: 3,
      empty-fallback: REJECT,
      url: 'https://g.cn/generate_204',
      lazy: true,
      strategy: 'sticky-sessions',
      include-all: true,
      exclude-type: 'DIRECT',
      icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Round_Robin.png',
      hidden: true,
    }

# 通用代理节点组
proxies_common:
  proxies_default:
    &proxies_default {
      proxies:
        [
          'Select',
          'Balance',
          'Auto',
          'HK',
          'JP',
          'US',
          'SG',
          'TW',
          'Other',
          'DIRECT',
        ],
    }

# 地区过滤器正则表达式定义
group_filter:
  HK_filter: &HK_filter { filter: '🇭🇰|港|HK|[Hh]ong\s*[Kk]ong' }
  JP_filter: &JP_filter { filter: '🇯🇵|JP|JP|[Jj]apan' }
  US_filter: &US_filter { filter: '🇺🇸|美|US|[Aa]merica|[Uu]nited\s*[Ss]tates' }
  SG_filter: &SG_filter { filter: '🇸🇬|SG|狮城|SG|[Ss]ingapore' }
  TW_filter: &TW_filter { filter: '🇹🇼|台湾|TW|[Tt]aiwan' }
  exclude_filter:
    &exclude_filter {
      exclude-filter: '港|HK|🇭🇰|JP|JP|🇯🇵|美|US|🇺🇸|SG|SG|🇸🇬|台湾|TW|🇹🇼',
      exclude-type: 'DIRECT',
    }

# 定义分流策略组
proxy-groups:
  - name: 'Select'
    <<: *group_common_select
    proxies:
      [
        'Balance',
        'Auto',
        'HK',
        'JP',
        'US',
        'SG',
        'TW',
        'Other',
      ]
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png'

  - name: 'Balance'
    <<: [*group_common_load, *HK_filter, *JP_filter, *SG_filter, *TW_filter]

  - name: 'Auto'
    <<: *group_common_auto
    proxies: ['HK-Auto', 'JP-Auto', 'TW-Auto', 'SG-Auto']

  - name: 'Telegram'
    default-selected: 'Auto'
    <<: [*group_common_select, *proxies_default]
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png'

  - name: 'AI'
